<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Device Guard Extract</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .page {
            width: min(900px, calc(100% - 32px));
            margin: 48px auto;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .header p {
            margin: 0;
            color: #6b7280;
        }

        .card {
            padding: 32px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
        }

        .upload-form {
            display: grid;
            gap: 20px;
        }

        .file-input {
            padding: 24px;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            background: #f8fafc;
        }

        .file-input label {
            display: block;
            margin-bottom: 12px;
            font-weight: 700;
        }

        input[type="file"] {
            width: 100%;
        }

        button {
            width: fit-content;
            padding: 12px 22px;
            border: 0;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #374151;
        }

        .message {
            margin-top: 24px;
            padding: 16px;
            border-radius: 10px;
        }

        .error {
            background: #fef2f2;
            color: #991b1b;
        }

        .success {
            background: #ecfdf5;
            color: #065f46;
        }

        .file-details {
            margin: 8px 0 0;
            padding-left: 20px;
        }

        code {
            padding: 2px 5px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 4px;
        }
    </style>
</head>

<body>

<main class="page">

    <header class="header">
        <h1>Device Guard Extract</h1>
        <p>Upload a receipt image to extract purchase information.</p>
    </header>

    <section class="card">

        <form
                class="upload-form"
                method="post"
                action="/receipts/extract"
                enctype="multipart/form-data">

            <div class="file-input">
                <label for="file">Receipt image</label>

                <input
                        id="file"
                        name="file"
                        type="file"
                        accept="image/png,image/jpeg,image/webp"
                        required>
            </div>

            <button type="submit">
                Extract receipt
            </button>

        </form>

        <div
                class="message error"
                th:if="${error}"
                th:text="${error}">
        </div>

        <div
                class="message success"
                th:if="${fileName}">

            <strong>Image uploaded successfully.</strong>

            <ul class="file-details">
                <li>
                    File:
                    <code th:text="${fileName}"></code>
                </li>

                <li>
                    Content type:
                    <code th:text="${contentType}"></code>
                </li>

                <li>
                    Size:
                    <code th:text="${fileSize + ' bytes'}"></code>
                </li>
            </ul>

        </div>

    </section>

</main>

</body>
</html>
